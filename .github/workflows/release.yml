name: Release

on:
  push:
    tags:
      - "develop-v*"
      - "release-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Read version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "VERSION=${TAG#*-v}" >> "$GITHUB_ENV"
          if [[ "$TAG" == release-v* ]]; then echo "CHANNEL=release" >> "$GITHUB_ENV"; else echo "CHANNEL=develop" >> "$GITHUB_ENV"; fi

      - name: Test
        run: swift test

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Package
        run: |
          ./scripts/make-dmg.sh
          ditto -c -k --keepParent "build/Notch Stash.app" "build/NotchStash-${VERSION}.zip"

      - name: Release notes
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > build/notes.md
          if [ ! -s build/notes.md ]; then echo "Notch Stash ${VERSION}" > build/notes.md; fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=(--title "Notch Stash ${VERSION}" --notes-file build/notes.md)
          if [ "$CHANNEL" = "develop" ]; then FLAGS+=(--draft --prerelease); else FLAGS+=(--latest); fi
          gh release create "$GITHUB_REF_NAME" "build/NotchStash-${VERSION}.dmg" "build/NotchStash-${VERSION}.zip" "${FLAGS[@]}"

  windows:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Read version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#*-v}" >> "$GITHUB_ENV"

      - name: Test
        shell: bash
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build app
        shell: bash
        run: flutter build windows --release --build-name="$VERSION"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\NotchStash.iss'

      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "build\NotchStash-Windows-$env:VERSION.zip"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "build/installer/NotchStash-Setup-${VERSION}.exe" "build/NotchStash-Windows-${VERSION}.zip" --clobber
